name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --import

      - name: Unit tests
        run: ~/godot/godot --headless --script res://tests/test_runner.gd

      - name: Autoplay battle
        run: ~/godot/godot --headless --script res://tests/integration/autoplay_battle.gd

      - name: Simulated runs
        run: ~/godot/godot --headless --script res://tests/integration/autoplay_run.gd -- 3

      - name: Player input smoke test
        run: ~/godot/godot --headless --script res://tests/integration/player_input_smoke.gd

      - name: Screens end-to-end
        run: ~/godot/godot --headless --script res://tests/integration/autoplay_ui_run.gd
